map $uri $campus_app_path {
    default 0;
    /api/auth/session 1;
    /api/auth/logout 1;
    /api/campus/session 1;
    /api/campus/state 1;
    /api/campus/presence 1;
    /api/campus/chat 1;
    "~^/api/campus/chat/[0-9a-f-]{36}$" 1;
    /api/campus/album 1;
    "~^/api/campus/album/[0-9a-f-]{36}$" 1;
    /api/campus/clues 1;
    "~^/api/campus/clues/[a-z0-9][a-z0-9-]{0,39}(/answer)?$" 1;
}

server {
    listen 8080;
    server_name _;
    root /run/campus/web;
    index index.html;
    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location = /手机校园/深中随身校园.html {
        absolute_redirect off;
        if ($http_sec_fetch_dest = document) { return 302 /$is_args$args; }

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src __CAMPUS_SCRIPT_POLICY__; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src data: blob:; font-src data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
        try_files $uri =404;
    }

    location ^~ /api/ {
        if ($campus_app_path = 0) { return 404; }
        if ($args != "") { return 400; }
        client_max_body_size 4m;
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Campus-User-ID $http_x_campus_user_id;
        proxy_set_header X-Campus-Client-IP __CAMPUS_CLIENT_IP__;
        proxy_set_header If-Match $http_if_match;
        proxy_set_header X-Campus-Photo-Metadata $http_x_campus_photo_metadata;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $campus_upstream http://campus-api:8080;
        proxy_pass $campus_upstream$uri;
    }

    location = /release.json { try_files $uri =404; }
    location = /.weconq-release.json { alias /run/campus/web/release.json; default_type application/json; }
    location ~ /\. { return 404; }
    location ~ \.mjs$ { types { text/javascript mjs; } try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
