worker_processes 1;
pid /run/campus/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /run/campus/client_body;
    proxy_temp_path /run/campus/proxy;
    fastcgi_temp_path /run/campus/fastcgi;
    scgi_temp_path /run/campus/scgi;
    uwsgi_temp_path /run/campus/uwsgi;
    include /run/campus/site.conf;
}
